<body>
    <h1>El Pollo Loco</h1>
    <nav id="main-menu" class="game-title">
        <div class="background">
            <section class="menu">
                <section class="top-left-buttons">
                    <button id="btn-impressum" class="game-btn" onclick="impressumModal()">
                        Impressum
                    </button>
                </section>
                <section class="top-right-buttons">
                    <button id="btn-mute" class="game-btn" onclick="toggleMute()">
                        Sound - On/Off
                    </button>
                    <button id="btn-tutorial" class="game-btn" onclick="gameControlNotice()">
                        Game Control Setting
                    </button>
                </section>
            </section>
            <section class="center-play">
                <button id="btn-play" class="play-btn" onclick="startGame()">
                    Play
                </button>
            </section>
        </div>
    </nav>
    <div id="tutorial-modal" class="modal hidden">
    </div>
    <div id="impressum-modal" class="modal hidden">
    </div>
    <canvas id="canvas" width="720" height="480"></canvas>
